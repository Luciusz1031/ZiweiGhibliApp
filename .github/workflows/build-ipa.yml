name: Build iOS IPA

on:
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵點擊執行
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14 # 使用 GitHub 官方免費的 Apple Silicon (M1/M2) macOS 伺服器
    
    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 檢查並選擇最佳 Xcode 版本
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          fi
          xcodebuild -version

      - name: 安裝 XcodeGen
        run: |
          brew install xcodegen

      - name: 生成 Xcode 專案檔 (Generate Xcode Project)
        run: |
          xcodegen generate
          # 雙重保險：將 Xcode 16 的 format 77 強制替換為 Xcode 15 相容的 60
          sed -i '' 's/objectVersion = 77;/objectVersion = 60;/g' ZiweiGhibliApp.xcodeproj/project.pbxproj || true

      - name: 驗證 Xcode 專案結構
        run: |
          xcodebuild -list -project ZiweiGhibliApp.xcodeproj

      - name: 編譯 iOS Release Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project ZiweiGhibliApp.xcodeproj \
            -scheme ZiweiGhibliApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/ZiweiGhibliApp.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: 打包成 .ipa 檔案 (Package to IPA)
        run: |
          mkdir -p build/Payload
          cp -r build/ZiweiGhibliApp.xcarchive/Products/Applications/ZiweiGhibliApp.app build/Payload/
          cd build
          zip -r -q ../ZiweiGhibliApp.ipa Payload
          cd ..
          echo "✅ IPA 打包成功！大小："
          ls -lh ZiweiGhibliApp.ipa

      - name: 上傳 IPA 供使用者下載 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ZiweiGhibliApp-IPA
          path: ZiweiGhibliApp.ipa
          retention-days: 14
