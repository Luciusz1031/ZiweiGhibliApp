name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 JDK 17 (Setup Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Gradle (Setup Gradle)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 編譯 Android APK (Build Debug APK)
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: 檢查輸出的 APK (Verify APK)
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk XiaoLuerZiwei.apk
          echo "✅ Android APK 編譯成功！大小："
          ls -lh XiaoLuerZiwei.apk

      - name: 上傳 Android APK 供使用者下載 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: XiaoLuerZiwei-APK
          path: XiaoLuerZiwei.apk
          retention-days: 14
